# One-click deploy on Render.com (free tier): New → Blueprint → select this repo.
services:
  - type: web
    name: levelup-gear
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py seed_demo && python manage.py expire_unpaid_orders && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: MOCK_GATEWAY_SECRET
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # Hostname, CSRF origin and SITE_URL come from RENDER_EXTERNAL_HOSTNAME, which Render sets
      # automatically, so the service can be renamed freely. Add a custom domain here if you use one.
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      # Password for the staff account "admin" (dashboard + Django admin).
      # Render asks for it when the Blueprint is created; never reuse the README demo password.
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: PAYMENT_MODE
        value: mock
      # ON for the course demo so graders can try VNPay / MoMo / bank transfer end to end.
      # The simulated gateway marks orders paid without real money: this site sells nothing.
      # For a real shop set this to "False" and configure real VNPay keys instead.
      # (MOCK_GATEWAY_SECRET above signs the simulated callbacks and is auto-generated.)
      - key: ALLOW_MOCK_PAYMENTS
        value: "True"
      # The web service's disk is wiped on every deploy: keep admin uploads in PostgreSQL instead.
      - key: MEDIA_STORAGE
        value: database
      # Real visitor IP behind Render's proxy (order log, login lockout, rate limits). Render's edge sets
      # CF-Connecting-IP itself; failing that, only the last X-Forwarded-For hop (added by Render) is trusted.
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: levelup-db
          property: connectionString
databases:
  - name: levelup-db
    plan: free
